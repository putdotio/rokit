packages:
  - "."

overrides:
  vite: "catalog:"
  vitest: "catalog:"

allowBuilds:
  "@parcel/watcher": true
  msgpackr-extract: true
minimumReleaseAgeExclude:
  - "@effect/platform-node-shared"
  - "@effect/platform-node"
  - "@effect/vitest"
  - effect
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vitest: 4.1.10
  vite-plus: 0.2.6
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
