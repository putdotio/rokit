packages:
  - "."

overrides:
  "@effect/platform-node-shared": 4.0.0
  vite: "catalog:"
  vitest: "catalog:"

allowBuilds:
  "@parcel/watcher": true
  # skillcheck lint needs no optional-dep build scripts (eval-only deps).
  "@playwright/browser-chromium": false
  "@swc/core": false
  esbuild: false
  msgpackr-extract: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
minimumReleaseAgeExclude:
  # Exact versions or `pkg@v1 || v2` unions only; `pkg@^range` is rejected by design.
  - "@effect/platform-node-shared@4.0.0"
  - "@effect/platform-node@4.0.0"
  - "@effect/vitest@4.0.0"
  - "effect@4.0.0"
  - "@uinaf/skillcheck@0.4.0"
  - "@voidzero-dev/vite-plus-core@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0"
  - vite-plus@1.0.0
catalog:
  "@vitest/coverage-v8": 5.0.1
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
  vite-plus: 1.0.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
patchedDependencies:
  jpeg-js@0.4.4: patches/jpeg-js@0.4.4.patch
