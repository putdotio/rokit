packages:
  - "."

overrides:
  "@effect/platform-node-shared": 4.0.0-beta.107
  vite: "catalog:"
  vitest: "catalog:"

allowBuilds:
  "@parcel/watcher": true
  # skillcheck lint needs no optional-dep build scripts (eval-only deps).
  "@playwright/browser-chromium": false
  "@swc/core": false
  esbuild: false
  msgpackr-extract: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
minimumReleaseAgeExclude:
  # Exact versions or `pkg@v1 || v2` unions only; `pkg@^range` is rejected by design.
  - "@effect/platform-node-shared@4.0.0-beta.107"
  - "@effect/platform-node@4.0.0-beta.107"
  - "@effect/vitest@4.0.0-beta.107"
  - "effect@4.0.0-beta.107"
  - "@uinaf/skillcheck@0.4.0"
catalog:
  "@vitest/coverage-v8": 4.1.10
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.10
  vite-plus: 0.2.9
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
patchedDependencies:
  jpeg-js@0.4.4: patches/jpeg-js@0.4.4.patch
